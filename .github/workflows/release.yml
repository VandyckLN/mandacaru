name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deb:
    uses: ./.github/workflows/deb.yml

  windows-exe:
    uses: ./.github/workflows/windows-exe.yml

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag precisa bater com a versao do pacote
        run: |
          version=$(python -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("src/mandacaru/__init__.py").read()).group(1))')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != versao $version"; exit 1; }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*
          if-no-files-found: error

  pypi:
    needs: [wheel, deb]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [pypi, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
