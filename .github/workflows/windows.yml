name: Windows

on:
  pull_request:
    paths: ["windows/**", "src/mandacaru/**", ".github/workflows/windows.yml"]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install . "./windows[dev]"
      - name: Testes
        working-directory: windows
        run: python -m pytest -q
      - name: Versao do pacote (e checagem contra a tag)
        id: ver
        shell: bash
        run: |
          version=$(python -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("src/mandacaru/__init__.py", encoding="utf-8").read()).group(1))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != versao $version"; exit 1; }
          fi
      - name: PyInstaller
        working-directory: windows
        run: pyinstaller mandacaru-win.spec --noconfirm
      - name: Autoteste do executavel congelado
        working-directory: windows
        run: |
          $p = Start-Process dist\Mandacaru\Mandacaru.exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "$env:TEMP\mandacaru-selftest.txt") { Get-Content "$env:TEMP\mandacaru-selftest.txt" }
          if ($p.ExitCode -ne 0) { throw "autoteste falhou (codigo $($p.ExitCode))" }
      - name: Instalador (Inno Setup)
        working-directory: windows
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nao encontrado" }
          & $iscc "/DMyAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc falhou ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/dist/installer/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer
      - name: Esperar o release criado pelo release.yml
        run: |
          for i in $(seq 1 240); do
            gh release view "$GITHUB_REF_NAME" && exit 0
            echo "release ainda nao existe ($i/240)"; sleep 30
          done
          echo "o release $GITHUB_REF_NAME nao apareceu a tempo (2 h); o release.yml pode estar aguardando aprovacao do ambiente pypi ou falhou"; exit 1
      - run: gh release upload "$GITHUB_REF_NAME" installer/*.exe --clobber
