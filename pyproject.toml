[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandacaru"
version = "0.1.0"
description = "Antivirus/EDR de codigo aberto focado em ataques gerados ou conduzidos por IA"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Vandyck Diniz" }]
keywords = ["antivirus", "edr", "security", "yara", "ebpf", "linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "yara-python>=4.3",
  "psutil>=5.9",
  "watchdog>=3.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# eBPF: instale o pacote do sistema (ex.: apt install python3-bpfcc)

[project.urls]
Homepage = "https://github.com/VandyckLN/mandacaru"
Issues = "https://github.com/VandyckLN/mandacaru/issues"

[project.scripts]
mandacaru = "mandacaru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mandacaru = ["rules/yara/*.yar"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
