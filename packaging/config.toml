# Mandacaru - configuracao do servico. Depois de editar: sudo systemctl restart mandacaru

[monitor]
# Pastas vigiadas. Sem esta chave: Downloads, Documentos e Desktop de cada usuario, mais /tmp e /dev/shm.
# paths = ["/home/ana/Downloads", "/srv/uploads"]
ebpf = true          # ve todo execve pelo kernel; se nao funcionar, cai para psutil sozinho

[alerts]
min_severity = "LOW" # INFO | LOW | MEDIUM | HIGH | CRITICAL
json = "/var/log/mandacaru/alerts.jsonl"
socket = "/run/mandacaru/alerts.sock"  # alertas em tempo real p/ o grupo mandacaru; "" desliga

[rules]
dirs = ["/etc/mandacaru/rules.d"]   # suas regras .yar

[exclude]
paths = []           # globs de caminho absoluto, ex.: "/home/*/.cache/*"

[quarantine]
enabled = true
min_severity = "HIGH"
retention_days = 30
max_file_mb = 256
max_total_mb = 2048

[analysis]
# Team Cymru MHR e gratuito so para uso NAO comercial; em uso por empresa, desligue (false)
cymru = true
# opcionais; sem elas a analise usa so Team Cymru + CIRCL (gratuitos, sem chave)
# virustotal_key = ""
# malwarebazaar_key = ""

[vuln]
enabled = true
cache_ttl_hours = 24
kev_enrichment = true          # cruza CVEs encontradas com o catalogo CISA KEV
correlate_running_procs = true # eleva para CRITICAL_ACTIVE se o pacote estiver carregado em /proc
alert_min_cvss = 7.0

[telemetry]
# Privacidade por padrao (LGPD): desligada ate opt-in explicito
level = "off"                  # off | iocs_only | samples_elf
require_approval = true        # exige `mandacaru telemetry approve <id>` antes de enviar
tlp = "TLP:CLEAR"              # TLP:CLEAR | TLP:GREEN
max_sample_mb = 15
hub_enabled = false
hub_endpoint = ""              # ex.: "https://hub.example.invalid/v1/reports" (troque pelo seu)
misp_enabled = false
misp_url = ""                  # chave API lida apenas de MANDACARU_MISP_API_KEY (nunca no TOML)
misp_verify_tls = true

[ml]
enabled = true
# mode = "shadow"   # off | shadow | alert | isolate (o padrao vem do programa)
