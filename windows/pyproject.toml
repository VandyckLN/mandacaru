[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandacaru-windows"
version = "0.8.3"
description = "Interface gráfica do Mandacaru para Windows"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["mandacaru-edr", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]
mandacaru-win = "mandacaru_win.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mandacaru_win = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["windows: só roda no Windows"]
